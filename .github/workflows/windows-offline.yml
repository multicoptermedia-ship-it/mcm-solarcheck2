name: windows-offline-validation
on:
  push:
    branches:
      - main
      - development/rgb-photogrammetry
      - feature/offline-human-report-approval
      - feature/offline-project-rgb-preview-gui
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    # Windows Server 2022 runner validates real Win32 APIs, NOT Windows 10 certification.
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Test whole-flight RGB SfM graph and RTK bundle adjustment
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          python -m pytest -q tests/test_rgb_per_camera_reprojection_gate.py tests/test_rgb_multiview_parallax_gate.py tests/test_rgb_sfm_track_support_gate.py tests/test_rgb_private_pitched_plane_candidates.py tests/test_rgb_private_pitched_plane_orthorectification.py tests/test_rgb_private_multi_plane_preview.py tests/test_rgb_camera_initialization.py tests/test_rgb_focal_bundle_refinement.py tests/test_rgb_reconstructed_surface_candidate.py tests/test_rgb_flight_surface_output.py tests/test_rgb_sfm_link_graph_gate.py tests/test_rgb_zip_whole_flight_reconstruction.py tests/test_rgb_global_camera_network.py tests/test_rgb_global_bundle_adjustment.py tests/test_rgb_windowed_bundle_adjustment.py tests/test_rgb_rtk_camera_priors.py tests/test_rgb_rtk_joint_bundle_adjustment.py
      - name: Test real Windows DPAPI and local desktop/admin boundaries
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_windows_admin_native.py tests/test_windows_admin_dpapi_boundary.py tests/test_windows_admin_credential_migration_lock.py tests/test_offline_admin_password_rotation_gui.py tests/test_windows_offline_startup.py tests/test_windows10_offline_vertical.py tests/test_offline_module_launcher.py tests/test_offline_wheelhouse.py tests/test_windows_wheelhouse_package.py tests/test_offline_training_jobs.py tests/test_offline_report_training_optin.py tests/test_offline_ai_open_source.py tests/test_public_infrared_import.py tests/test_public_infrared_baseline.py tests/test_m3t_original_zip_archive.py tests/test_m3t_original_zip_cli.py tests/test_original_zip_project_bridge.py tests/test_windows10_original_zip_acceptance.py tests/test_original_files_project_bridge.py tests/test_plant_identity_readiness_vertical.py tests/test_original_files_acceptance.py tests/test_gui_project_rgb_preview.py
      - name: Start disposable offline desktop without Python network access
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m mcm_solarcheck.offline.windows_smoke --headless
